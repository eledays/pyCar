class Engine:
    def __init__(self):
        self.started = False
        self.power = 0
    
    def start(self):
        self.started = True

    def stop(self):
        self.started = False

    def set_power(self, value):
        self.power = value / 100

class Headlights:
    def __init__(self):
        self.state = 0
    
    def on(self):
        self.state = 1

    def off(self):
        self.state = 0

class Steering:
    def __init__(self):
        self.angle = 0
    
    def set_angle(self, value):
        self.angle = value

class Brakes:
    def __init__(self):
        self.state = 0
    
    def on(self):
        self.state = 1
    
    def off(self):
        self.state = 0
    
    def set_value(self, value):
        self.value = value

class Gearbox:
    def __init__(self):
        self.gear = 0
        
    def D(self):
        self.gear = 1

    def R(self):
        self.gear = -1

    def P(self):
        self.gear = 0

class FuelSystem:
    def __init__(self):
        self.fuel = 100

    def add_fuel(self, value):
        self.fuel += value

    def get_fuel(self):
        return self.fuel

class Car:
    def __init__(self):
        global gameObjects
        gameObjects.append(self)

        self.engine = Engine()
        self.headlights = Headlights()
        self.steering = Steering()
        self.brakes = Brakes()
        self.gearbox = Gearbox()
        self.fuel_system = FuelSystem()

class Light:
    RED = 0
    YELLOW = 1
    GREEN = 2
    def __init__(self, id, color):
        global gameObjects
        gameObjects.append(self)

        self.id = id
        self.color = color
        self.str_color = ['red', 'yellow', 'green'][self.color]

    def set_color(self, color):
        self.color = color
        self.str_color = ['red', 'yellow', 'green'][self.color]

    def get_color(self):
        return self.color

gameObjects = []

RED = 0
YELLOW = 1
GREEN = 2

car = Car()
light = Light(2, GREEN)

print(gameObjects)
